name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx --yes @azure/static-web-apps-cli deploy dist --env production --deployment-token "$SWA_TOKEN"
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_DEPLOYMENT_TOKEN }}
