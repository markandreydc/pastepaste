name: Deploy Server to Azure Container Apps (main)

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: |
            ghcr.io/markandreydc/pastepaste-api:latest
            ghcr.io/markandreydc/pastepaste-api:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name pastepaste-api \
            --resource-group rg-pastepaste \
            --image ghcr.io/markandreydc/pastepaste-api:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 1

      - name: Enable sticky sessions
        run: |
          az containerapp ingress sticky-sessions set \
            --name pastepaste-api \
            --resource-group rg-pastepaste \
            --affinity sticky
